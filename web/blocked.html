<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus time</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center;
         background: #0f1216; color: #eef2f7; font: 16px/1.5 -apple-system, system-ui, sans-serif; padding: 32px; }
  .wrap { max-width: 460px; }
  .mark { font-size: 54px; line-height: 1; margin-bottom: 18px; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  p { color: #93a0b1; margin: 0 0 8px; }
  .until { display: inline-block; margin-top: 18px; padding: 9px 16px; border-radius: 999px;
           background: #181d24; border: 1px solid #262d37; color: #eef2f7; font-size: 14px; }
  footer { margin-top: 28px; color: #5c6a7c; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">🌱</div>
    <h1>{{headline}}</h1>
    <p>{{detail}}</p>
    <div class="until">{{until}}</div>
    <footer>FocusGuard{{note}}</footer>
  </div>
</body>
</html>
