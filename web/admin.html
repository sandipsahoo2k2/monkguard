<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>MonkGuard</title>
<style>
  :root {
    --bg: #0f1216; --card: #181d24; --line: #262d37; --text: #eef2f7;
    --dim: #93a0b1; --good: #3ddc97; --warn: #ffb347; --bad: #ff6b6b; --accent: #5b9cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, sans-serif;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); max-width: 620px; margin-inline: auto;
  }
  h1 { font-size: 19px; margin: 4px 0 14px; display: flex; align-items: center; gap: 8px; }
  h1 small { color: var(--dim); font-weight: 400; font-size: 13px; }
  .device {
    display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline;
    margin: -6px 0 14px; color: var(--dim); font-size: 13px;
  }
  .device b { color: var(--text); font-weight: 600; font-size: 14px; }
  .device code {
    font: 12px ui-monospace, Menlo, monospace; background: #1d242e;
    border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; color: var(--text);
  }
  @media (prefers-color-scheme: light) { .device code { background: #eef1f6; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .state { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .big { font-size: 22px; font-weight: 650; }
  .dim { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .modeBox { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .modeLabel { font-size: 13px; color: var(--dim); margin-bottom: 8px; }
  #modeHint { margin-top: 8px; }
  #actions { flex-wrap: wrap; }
  #actions button { flex: 1 1 30%; }
  .live { margin-top: 14px; }
  button {
    font: inherit; color: var(--text); background: #222a34; border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 10px; cursor: pointer; min-height: 46px;
  }
  button:active { transform: scale(.98); }
  button.on { background: var(--accent); border-color: var(--accent); color: #07101f; font-weight: 650; }
  button.ghost { background: transparent; }
  button.wide { width: 100%; margin-top: 8px; }
  button.good { background: #1d4034; border-color: #27584a; }
  button.bad { background: #3d1f23; border-color: #5a2b31; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stats .stat:nth-child(5):last-child { grid-column: span 2; }
  .stat { background: #141a21; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .stat b { display: block; font-size: 21px; font-weight: 650; }
  .stat span { color: var(--dim); font-size: 12px; }
  .bar { height: 6px; border-radius: 3px; background: #222a34; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); }
  .bar i.over { background: var(--bad); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 0 0 10px; }
  label.field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  label.field:last-of-type { border-bottom: 0; }
  label.field span { font-size: 15px; }
  label.field small { display: block; color: var(--dim); font-size: 12px; }
  select {
    font: inherit; background: #0f141a; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; flex: none;
  }
  input[type=number], input[type=time], input[type=text], input[type=password] {
    font: inherit; background: #0f141a; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; width: 92px; text-align: right;
  }
  input[type=text] { width: 100%; text-align: left; }
  input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  .pending { border: 1px solid #4a3a1c; background: #241e12; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .pending .why { color: var(--dim); font-size: 12px; margin: 4px 0 10px; }
  .win { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 9px 0; }
  .days button { padding: 8px 0; min-height: 38px; font-size: 13px; }
  .times { display: flex; align-items: center; gap: 8px; }
  .times input { width: 100%; text-align: center; }
  ul.log { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
  ul.log li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  ul.log li:last-child { border-bottom: 0; }
  ul.log time { color: var(--dim); font-size: 12px; margin-right: 8px; }
  .notice { background: #3a2a12; border: 1px solid #5c4420; color: #ffd79a; border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: 14px; }
  .live { font-size: 14px; color: var(--dim); }
  .live div { padding: 3px 0; }
  details summary { cursor: pointer; color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: .07em; }
  details[open] summary { margin-bottom: 12px; }
  #login { position: fixed; inset: 0; background: var(--bg); display: none; place-content: center; padding: 24px; z-index: 10; }
  #login .card { width: min(100%, 320px); }
  #login input { width: 100%; text-align: center; font-size: 26px; letter-spacing: .3em; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #273040;
           border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; font-size: 14px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6f9; --card: #fff; --line: #e2e7ee; --text: #121722; --dim: #5e6b7d; }
    button { background: #eef1f6; }
    .stat, select, input[type=number], input[type=time], input[type=text], input[type=password] { background: #f7f9fc; }
    .bar { background: #e6eaf1; }
    button.on { color: #fff; }
    .pending { background: #fff6e2; border-color: #f0dcae; }
    button.good { background: #d8f1e5; border-color: #a5d8c0; }
    button.bad { background: #fbe0e0; border-color: #efb7b7; }
    .notice { background: #fff4e0; border-color: #f0dcae; color: #6a4a06; }
  }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2>MonkGuard</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">
    <button class="wide on" id="loginBtn">Unlock</button>
    <p class="dim" id="loginMsg" style="margin:10px 0 0"></p>
  </div>
</div>

<div id="app" hidden>
  <h1>MonkGuard</h1>
  <div class="device" id="device"></div>
  <div id="notices"></div>

  <div class="card">
    <div class="state">
      <span class="dot" id="dot"></span>
      <span class="big" id="stateText">…</span>
    </div>
    <div class="dim" id="stateWhy"></div>
    <div class="modeLabel" id="actionsLabel" style="margin-top:16px"></div>
    <div class="row" id="actions"></div>
    <div class="dim" id="actionsHint" style="margin-top:8px"></div>
    <div class="modeBox">
      <div class="modeLabel">When should it block?</div>
      <div class="modes">
        <button data-mode="auto">My schedule</button>
        <button data-mode="lockdown">Always</button>
        <button data-mode="free">Never</button>
      </div>
      <div class="dim" id="modeHint"></div>
    </div>
    <div class="live" id="live"></div>
  </div>

  <div id="pendingWrap"></div>

  <div class="card">
    <h2>Today</h2>
    <div class="stats">
      <div class="stat"><b id="entMin">0</b><span>min fun video</span><div class="bar"><i id="entBar"></i></div></div>
      <div class="stat"><b id="eduMin">0</b><span>min learning video</span></div>
      <div class="stat"><b id="musicMin">0</b><span>min music</span></div>
      <div class="stat"><b id="shortsBlocked">0</b><span>reels stopped</span></div>
      <div class="stat"><b id="gamesBlocked">0</b><span>games stopped</span></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" style="flex:1" id="endBreak">End break now</button>
      <button class="ghost" style="flex:1" id="resetBudget">Reset today</button>
    </div>
  </div>

  <div class="card">
    <details id="rulesBox">
      <summary>Limits</summary>
      <label class="field"><span>Stop reels and shorts</span><input type="checkbox" id="blockShorts"></label>
      <label class="field"><span>Stop games</span><input type="checkbox" id="blockGames"></label>
      <label class="field"><span>Stop browser games</span><input type="checkbox" id="blockBrowserGames"></label>
      <label class="field"><span>Close Firefox, Tor and Opera<small>their tabs cannot be checked</small></span><input type="checkbox" id="blockUnreadableBrowsers"></label>
      <label class="field"><span>Fun video per day<small>minutes, 0 = none allowed</small></span><input type="number" id="entertainmentVideoBudgetMin" min="0" max="1440"></label>
      <label class="field"><span>Learning video per day<small>minutes, 0 = unlimited</small></span><input type="number" id="educationalVideoBudgetMin" min="0" max="1440"></label>
      <label class="field"><span>Songs<small>listening is not screen time</small></span>
        <select id="musicMode">
          <option value="audio">Listening free</option>
          <option value="all">All music free</option>
          <option value="off">Count as video</option>
        </select></label>
      <label class="field"><span>Music per day<small>minutes, 0 = unlimited</small></span><input type="number" id="musicBudgetMin" min="0" max="1440"></label>
      <label class="field"><span>Break after watching<small>minutes in a row, 0 = off</small></span><input type="number" id="continuousWatchLimitMin" min="0" max="480"></label>
      <label class="field"><span>Break length<small>minutes</small></span><input type="number" id="forcedBreakMin" min="1" max="120"></label>
      <label class="field"><span>Warn before closing a game<small>seconds</small></span><input type="number" id="gameGraceSeconds" min="5" max="600"></label>
      <label class="field" style="display:block"><span>Also block these sites<small>comma separated</small></span>
        <input type="text" id="blockedDomains" placeholder="example.com, anothersite.com" style="margin-top:8px"></label>
      <button class="wide on" id="saveRules">Save limits</button>
    </details>
  </div>

  <div class="card">
    <details id="scheduleBox">
      <summary>Free time windows</summary>
      <p class="dim" style="margin-top:0">Inside a window nothing is enforced. Everything else is focus time.</p>
      <div id="windows"></div>
      <button class="wide ghost" id="addWindow">Add a window</button>
      <button class="wide on" id="saveWindows">Save schedule</button>
    </details>
  </div>

  <div class="card">
    <details>
      <summary>Activity</summary>
      <ul class="log" id="log"></ul>
    </details>
  </div>

  <div class="card">
    <details>
      <summary>More</summary>
      <label class="field" style="display:block"><span>Name this Mac<small>whatever you want to call it — this is how you will tell it apart from other Macs in the house</small></span>
        <input type="text" id="displayName" maxlength="40" style="margin-top:8px"></label>
      <label class="field" style="display:block"><span>Note on the block page<small>optional, e.g. "back after dinner"</small></span>
        <input type="text" id="blockPageNote" maxlength="120" style="margin-top:8px"></label>
      <label class="field" style="display:block"><span>New PIN<small>at least 4 characters</small></span>
        <input type="password" id="newPin" style="margin-top:8px"></label>
      <button class="wide ghost" id="savePin">Change PIN</button>
      <label class="field" style="display:block"><span>Claude API key<small>optional, classifies unclear videos</small></span>
        <input type="password" id="llmApiKey" placeholder="leave blank to keep" style="margin-top:8px"></label>
      <button class="wide ghost" id="saveKey">Save key</button>
      <label class="field" style="display:block"><span>Who may open this page<small>phones on the home wifi, or only this Mac</small></span>
        <select id="lanAccess" style="margin-top:8px;max-width:100%">
          <option value="home">Phones on the home network</option>
          <option value="always">Any device on any network</option>
          <option value="never">Only this Mac</option>
        </select></label>
      <button class="wide ghost" id="trustNetwork">Trust the network I am on now</button>
      <button class="wide ghost" id="logout" style="margin-top:18px">Log out</button>
    </details>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// SHA-256, HMAC and PBKDF2, written out because window.crypto.subtle only
// exists on https or localhost, and the whole point here is a phone on the
// wifi talking plain http to this Mac. Small enough to read and check.
const K256 = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(bytes) {
  const h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const length = bytes.length;
  const withPadding = new Uint8Array((((length + 9) >> 6) + 1) << 6);
  withPadding.set(bytes);
  withPadding[length] = 0x80;
  const bits = length * 8;
  const view = new DataView(withPadding.buffer);
  view.setUint32(withPadding.length - 4, bits >>> 0);
  view.setUint32(withPadding.length - 8, Math.floor(bits / 4294967296));

  const w = new Uint32Array(64);
  for (let offset = 0; offset < withPadding.length; offset += 64) {
    for (let i = 0; i < 16; i += 1) w[i] = view.getUint32(offset + i * 4);
    for (let i = 16; i < 64; i += 1) {
      const a = w[i - 15], b = w[i - 2];
      const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
      const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i += 1) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K256[i] + w[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0; h[3] = (h[3] + d) >>> 0;
    h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;
  }
  const out = new Uint8Array(32);
  const outView = new DataView(out.buffer);
  h.forEach((value, i) => outView.setUint32(i * 4, value));
  return out;
}

function hmacSha256(key, message) {
  let block = new Uint8Array(64);
  if (key.length > 64) block.set(sha256(key));
  else block.set(key);
  const inner = new Uint8Array(64), outer = new Uint8Array(64);
  for (let i = 0; i < 64; i += 1) { inner[i] = block[i] ^ 0x36; outer[i] = block[i] ^ 0x5c; }
  const innerInput = new Uint8Array(64 + message.length);
  innerInput.set(inner); innerInput.set(message, 64);
  const innerHash = sha256(innerInput);
  const outerInput = new Uint8Array(96);
  outerInput.set(outer); outerInput.set(innerHash, 64);
  return sha256(outerInput);
}

function pbkdf2Sha256(password, salt, iterations) {
  const first = new Uint8Array(salt.length + 4);
  first.set(salt);
  first[salt.length + 3] = 1;                       // one 32-byte block is all we need
  let u = hmacSha256(password, first);
  const result = u.slice();
  for (let i = 1; i < iterations; i += 1) {
    u = hmacSha256(password, u);
    for (let j = 0; j < 32; j += 1) result[j] ^= u[j];
  }
  return result;
}

const toHex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
const fromHex = (hex) => new Uint8Array((hex.match(/../g) || []).map((pair) => parseInt(pair, 16)));
const utf8 = (text) => new TextEncoder().encode(text);

/**
 * The PIN never leaves this device.
 *
 * The service sends a salt and a one-time number; the browser derives the same
 * verifier the service holds and returns a signature over that number. Nothing
 * on the wifi can be replayed, and nothing on the wifi reveals the PIN — which
 * is why this works over plain http with no certificate for anyone to click
 * past. window.crypto.subtle is used when the page is on localhost, where it
 * exists and is faster; from a phone, the code above does it.
 */
async function deriveVerifier(pin, salt, iterations) {
  if (window.crypto && window.crypto.subtle) {
    try {
      const key = await crypto.subtle.importKey('raw', utf8(pin), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: utf8(salt), iterations, hash: 'SHA-256' }, key, 256);
      return toHex(new Uint8Array(bits));
    } catch (e) { /* not a secure context: fall through */ }
  }
  return toHex(pbkdf2Sha256(utf8(pin), utf8(salt), iterations));
}

async function proveKnowledge(pin) {
  const res = await fetch('/api/challenge');
  if (!res.ok) throw new Error('no answer from MonkGuard');
  const challenge = await res.json();
  const verifier = await deriveVerifier(pin, challenge.salt, challenge.iterations);
  return {
    nonce: challenge.nonce,
    proof: toHex(hmacSha256(fromHex(verifier), utf8(challenge.nonce))),
  };
}

const DAYS = ['S','M','T','W','T','F','S'];
let data = null, windows = [];
// A refresh must not overwrite what somebody is in the middle of typing, so an
// open section is left alone — but it has to be filled at least once, or a
// section opened before the first answer arrives stays empty.
let limitsFilled = false, scheduleFilled = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) { showLogin(); throw new Error('pin'); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) { toast(json.error || 'Did not work'); throw new Error(json.error || 'error'); }
  return json;
}

function showLogin(msg) {
  document.getElementById('login').style.display = 'grid';
  document.getElementById('app').hidden = true;
  if (msg) document.getElementById('loginMsg').textContent = msg;
}

document.getElementById('loginBtn').onclick = async () => {
  const pin = document.getElementById('pin').value;
  const button = document.getElementById('loginBtn');
  const message = document.getElementById('loginMsg');
  button.disabled = true;
  button.textContent = 'Checking…';
  message.textContent = '';
  // Let the button repaint before the key derivation takes over the thread.
  await new Promise(r => setTimeout(r, 30));
  try {
    const answer = await proveKnowledge(pin);
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(answer)
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { message.textContent = body.error || 'Wrong PIN'; return; }
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').hidden = false;
    document.getElementById('pin').value = '';
    refresh();
  } catch (e) {
    message.textContent = 'Could not reach MonkGuard';
  } finally {
    button.disabled = false;
    button.textContent = 'Unlock';
  }
};
for (const type of ['keydown', 'keyup']) {
  document.getElementById('pin').addEventListener(type, e => {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      document.getElementById('loginBtn').click();
    }
  });
}

function fmtUntil(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const sameDay = d.toDateString() === new Date().toDateString();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return sameDay ? time : d.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
}

function render() {
  const d = data;
  // Which Mac this is. Every Mac runs its own MonkGuard with its own settings,
  // so this page controls this machine and nothing else on the wifi.
  const dev = d.device || {};
  const net = d.network || {};
  // The address identifies the machine; the name is whatever this family typed.
  const address = (dev.addresses || [])[0];
  const onlyHere = net.lanAccess === 'never' || net.bindAddress === '127.0.0.1';
  document.getElementById('device').innerHTML =
    '<b>' + esc(dev.name || address || 'this Mac') + '</b>'
    + (address ? '<code>' + esc(address + ':' + dev.port) + '</code>' : '')
    + (onlyHere
        ? '<span>this Mac only</span>'
        : (dev.hostName ? '<code>' + esc(dev.hostName + '.local:' + dev.port) + '</code>' : ''))
    + (dev.account ? '<span>account ' + esc(dev.account) + '</span>' : '');
  // The card answers two questions in order: what is happening to this Mac right
  // now, and what can I do about it. The mode is a setting, so it sits below
  // both, and the free-time buttons only exist when there is something to free.
  const focus = d.state === 'focus';
  const temporary = Boolean(d.tempUnlockUntil);
  document.getElementById('dot').style.background = focus ? 'var(--bad)' : 'var(--good)';
  document.getElementById('stateText').textContent =
    focus ? 'Blocking now' : temporary ? 'Paused' : 'Not blocking';

  const until = fmtUntil(d.until);
  let why;
  if (focus) why = 'Reels, games and long videos are stopped' + (until ? ' until ' + until : '');
  else if (temporary) why = 'Nothing is blocked' + (until ? ' until ' + until : '');
  else if (d.mode === 'free') why = 'Nothing is being blocked, until you change it back';
  else why = (d.reason || 'Free time') + (until ? ' until ' + until : '');
  document.getElementById('stateWhy').textContent = why;

  const actions = [];
  let label = '', hint = '';
  if (focus) {
    label = 'Pause blocking for';
    actions.push('<button id="free15">15 min</button>');
    actions.push('<button id="free60">1 hour</button>');
    actions.push('<button id="freeEvening">Until 10 PM</button>');
    hint = 'Everything is allowed during the pause. Blocking then comes back by itself.';
  } else if (temporary) {
    actions.push('<button id="endFree" class="on">Resume blocking now</button>');
    hint = 'Or do nothing: blocking comes back by itself.';
  } else if (d.mode === 'free') {
    actions.push('<button id="backToSchedule" class="on">Start blocking again</button>');
  } else {
    actions.push('<button id="blockNow" class="ghost">Start blocking now</button>');
  }
  document.getElementById('actionsLabel').textContent = label;
  document.getElementById('actionsHint').textContent = hint;
  document.getElementById('actions').innerHTML = actions.join('');
  wireActions();

  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === d.mode));
  document.getElementById('modeHint').textContent = {
    auto: 'Blocking follows the free time windows you set below.',
    lockdown: 'Blocking all day, ignoring the schedule. A pause is the only break.',
    free: 'Never blocking. Nothing below applies.',
  }[d.mode] || '';

  const notices = [];
  (d.permissionProblems || []).forEach(() =>
    notices.push('macOS is blocking MonkGuard from reading browser tabs. Open System Settings \u203a Privacy & Security \u203a Automation and switch on your browsers under MonkGuard.'));
  if (net.lanAccess === 'home' && !net.homeNetworkChosen) {
    notices.push('No home network chosen yet, so only this Mac can open MonkGuard. Trust this network under More.');
  } else if (net.lanAccess === 'home' && !net.onHomeNetwork) {
    notices.push('This Mac is away from the home network, so phones cannot open MonkGuard right now.');
  }
  (d.downtime || []).forEach(x => notices.push(x.detail + ' (' + fmtUntil(x.at) + ')'));
  if (d.breakUntil) notices.push('Break until ' + fmtUntil(d.breakUntil));
  document.getElementById('notices').innerHTML = notices.map(n => '<div class="notice">' + esc(n) + '</div>').join('');

  const live = (d.live || []).map(l => '<div>' + esc(l) + '</div>').join('');
  document.getElementById('live').innerHTML = live ? 'On screen now:' + live : '';

  document.getElementById('entMin').textContent = d.today.entertainmentMin;
  document.getElementById('eduMin').textContent = d.today.educationalMin;
  document.getElementById('musicMin').textContent = d.today.musicMin;
  document.getElementById('shortsBlocked').textContent = d.today.shortsBlocked;
  document.getElementById('gamesBlocked').textContent = d.today.gamesBlocked;
  const budget = d.rules.entertainmentVideoBudgetMin;
  const bar = document.getElementById('entBar');
  const pct = budget > 0 ? Math.min(100, Math.round(d.today.entertainmentMin / budget * 100)) : 0;
  bar.style.width = pct + '%';
  bar.classList.toggle('over', budget > 0 && d.today.entertainmentMin >= budget);

  document.getElementById('pendingWrap').innerHTML = (d.pending || []).map(p =>
    '<div class="pending"><b>' + esc(p.name) + '</b> looks like a game' +
    (p.minutes ? ' · ' + p.minutes + ' min today' : '') +
    '<div class="why">' + esc((p.reasons || []).join(', ')) + '</div>' +
    '<div class="row" data-app="' + esc(p.bundleId) + '"><button class="bad" style="flex:1" data-game="yes">It is a game</button>' +
    '<button class="good" style="flex:1" data-game="no">Not a game</button></div></div>'
  ).join('');
  document.querySelectorAll('#pendingWrap button').forEach(b => b.onclick = () =>
    verdict(b.parentElement.dataset.app, b.dataset.game === 'yes'));

  if (!limitsFilled || !document.getElementById('rulesBox').open) {
    for (const key of ['blockShorts','blockGames','blockBrowserGames','blockUnreadableBrowsers']) {
      document.getElementById(key).checked = d.rules[key];
    }
    document.getElementById('musicMode').value = d.rules.musicMode || 'audio';
    for (const key of ['entertainmentVideoBudgetMin','educationalVideoBudgetMin','musicBudgetMin','continuousWatchLimitMin','forcedBreakMin','gameGraceSeconds']) {
      document.getElementById(key).value = d.rules[key];
    }
    document.getElementById('blockedDomains').value = (d.rules.blockedDomains || []).join(', ');
    limitsFilled = true;
  }
  document.getElementById('displayName').value = d.displayName || '';
  document.getElementById('displayName').placeholder = (dev.systemName || 'e.g. Anya\'s Mac');
  document.getElementById('blockPageNote').value = d.blockPageNote || '';
  document.getElementById('lanAccess').value = net.lanAccess || 'home';
  document.getElementById('llmApiKey').placeholder = d.rules.hasLLMKey ? 'saved — type to replace' : 'optional';

  if (!scheduleFilled || !document.getElementById('scheduleBox').open) {
    windows = JSON.parse(JSON.stringify(d.windows || []));
    renderWindows();
    scheduleFilled = true;
  }

  document.title = (dev.name || (dev.addresses || [])[0] || '') + ' · MonkGuard';
  document.getElementById('log').innerHTML = (d.events || []).map(e =>
    '<li><time>' + fmtUntil(e.at) + '</time>' + esc(label(e)) + '</li>').join('');
}

function label(e) {
  const map = {
    blocked_shorts: 'Stopped reels', blocked_shorts_tab_closed: 'Closed a reels tab',
    blocked_browser_game: 'Stopped a game site', blocked_budget: 'Video time used up',
    forced_break: 'Break enforced', throttle: 'Watched too long in a row',
    app_warning: 'Warned before closing', app_quit: 'Closed an app',
    app_force_quit: 'Force closed an app', verdict: 'Answered',
    mode_changed: 'Mode changed to', temp_unlock: 'Blocking paused',
    temp_unlock_ended: 'Pause ended', service_downtime: 'MonkGuard was not running', port_changed: 'Admin page moved to',
    unreadable_browser: 'Closed a browser that cannot be checked', login_failed: 'Wrong PIN tried',
    config_edited_externally: 'Settings file edited directly'
  };
  return (map[e.kind] || e.kind) + ' · ' + e.subject + (e.detail ? ' — ' + e.detail : '');
}

function renderWindows() {
  document.getElementById('windows').innerHTML = windows.map((w, i) =>
    '<div class="win"><input type="text" value="' + esc(w.label) + '" oninput="windows[' + i + '].label=this.value">' +
    '<div class="days">' + DAYS.map((d, j) =>
      '<button class="' + (w.days.includes(j + 1) ? 'on' : '') + '" onclick="toggleDay(' + i + ',' + (j + 1) + ')">' + d + '</button>'
    ).join('') + '</div>' +
    '<div class="times"><input type="time" value="' + w.start + '" oninput="windows[' + i + '].start=this.value">' +
    '<span class="dim">to</span>' +
    '<input type="time" value="' + w.end + '" oninput="windows[' + i + '].end=this.value"></div>' +
    '<div class="row" style="margin-top:10px"><button class="ghost" style="flex:1" onclick="toggleWin(' + i + ')">' +
    (w.enabled ? 'On' : 'Off') + '</button>' +
    '<button class="ghost" style="flex:1" onclick="delWin(' + i + ')">Remove</button></div></div>'
  ).join('');
}
function toggleDay(i, day) {
  const days = windows[i].days;
  const at = days.indexOf(day);
  if (at >= 0) days.splice(at, 1); else days.push(day);
  renderWindows();
}
function toggleWin(i) { windows[i].enabled = !windows[i].enabled; renderWindows(); }
function delWin(i) { windows.splice(i, 1); renderWindows(); }
document.getElementById('addWindow').onclick = () => {
  windows.push({ label: 'Free time', days: [1,2,3,4,5,6,7], start: '16:00', end: '17:30', enabled: true });
  renderWindows();
};
document.getElementById('saveWindows').onclick = async () => {
  data = await api('/api/windows', { windows });
  document.getElementById('scheduleBox').open = false;
  render(); toast('Schedule saved');
};

document.getElementById('saveRules').onclick = async () => {
  const body = {};
  for (const key of ['blockShorts','blockGames','blockBrowserGames','blockUnreadableBrowsers']) body[key] = document.getElementById(key).checked;
  body.musicMode = document.getElementById('musicMode').value;
  for (const key of ['entertainmentVideoBudgetMin','educationalVideoBudgetMin','musicBudgetMin','continuousWatchLimitMin','forcedBreakMin','gameGraceSeconds']) {
    body[key] = parseInt(document.getElementById(key).value || '0', 10);
  }
  body.blockedDomains = document.getElementById('blockedDomains').value.split(',').map(s => s.trim()).filter(Boolean);
  data = await api('/api/rules', body);
  document.getElementById('rulesBox').open = false;
  render(); toast('Limits saved');
};

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = async () => {
  data = await api('/api/mode', { mode: b.dataset.mode }); render();
});
/** The buttons change with the situation, so they are wired after each render. */
function wireActions() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

  const free = (minutes, said) => async () => {
    data = await api('/api/unlock', { minutes }); render(); toast(said);
  };
  on('free15', free(15, 'Paused for 15 minutes'));
  on('free60', free(60, 'Paused for an hour'));
  on('freeEvening', async () => {
    // Until the end of the evening, which is what people mean by "tonight".
    const now = new Date();
    const bedtime = new Date(now);
    bedtime.setHours(22, 0, 0, 0);
    if (bedtime <= now) bedtime.setDate(bedtime.getDate() + 1);
    const minutes = Math.max(15, Math.min(480, Math.round((bedtime - now) / 60000)));
    data = await api('/api/unlock', { minutes });
    render(); toast('Paused until ' + fmtUntil(new Date(now.getTime() + minutes * 60000).toISOString()));
  });
  on('endFree', async () => { data = await api('/api/endunlock', {}); render(); toast('Pause ended'); });
  on('backToSchedule', async () => { data = await api('/api/mode', { mode: 'auto' }); render(); toast('Following the schedule again'); });
  on('blockNow', async () => { data = await api('/api/mode', { mode: 'lockdown' }); render(); toast('Blocking now'); });
}
document.getElementById('endBreak').onclick = async () => { await api('/api/endbreak', {}); refresh(); toast('Break ended'); };
document.getElementById('resetBudget').onclick = async () => { await api('/api/resetbudget', {}); refresh(); toast('Today reset'); };
document.getElementById('savePin').onclick = async () => {
  const pin = document.getElementById('newPin').value.trim();
  if (pin.length < 4) { toast('Use at least 4 characters'); return; }
  const button = document.getElementById('savePin');
  button.disabled = true; button.textContent = 'Saving…';
  await new Promise(r => setTimeout(r, 30));
  try {
    // A new PIN is derived here too, so changing it sends no more than logging in does.
    const salt = toHex(crypto.getRandomValues(new Uint8Array(16)));
    const iterations = 100000;
    const verifier = await deriveVerifier(pin, salt, iterations);
    await api('/api/pin', { salt, verifier, iterations });
    document.getElementById('newPin').value = '';
    toast('PIN changed — sign in again');
    setTimeout(() => showLogin('Signed out: the PIN changed'), 900);
  } finally {
    button.disabled = false; button.textContent = 'Change PIN';
  }
};
document.getElementById('saveKey').onclick = async () => {
  const key = document.getElementById('llmApiKey').value;
  data = await api('/api/rules', {
    llmApiKey: key,
    displayName: document.getElementById('displayName').value,
    blockPageNote: document.getElementById('blockPageNote').value,
  });
  document.getElementById('llmApiKey').value = '';
  render(); toast('Saved');
};
document.getElementById('lanAccess').onchange = async (e) => {
  data = await api('/api/lan-access', { mode: e.target.value });
  render(); toast('Saved');
};
document.getElementById('trustNetwork').onclick = async () => {
  data = await api('/api/trust-network', {});
  render(); toast('This network is now the home network');
};
document.getElementById('logout').onclick = async () => { await api('/api/logout', {}); showLogin('Logged out'); };

async function verdict(bundleId, isGame) {
  data = await api('/api/verdict', { bundleId, isGame });
  render(); toast(isGame ? 'Marked as a game' : 'Allowed');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function refresh() {
  try {
    data = await api('/api/status');
    document.getElementById('app').hidden = false;
    document.getElementById('login').style.display = 'none';
    render();
  } catch (e) { /* login shown */ }
}

refresh();
setInterval(() => { if (!document.getElementById('app').hidden) refresh(); }, 10000);
</script>
</body>
</html>
